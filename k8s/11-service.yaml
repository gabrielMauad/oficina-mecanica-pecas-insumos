apiVersion: v1
kind: Service
metadata:
  name: pecas-insumos
  namespace: oficina-mecanica
  labels:
    app: pecas-insumos
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  # NodePort 30083 = porta do listener do servico na NLB interna (infra-k8s); o API Gateway chega
  # aqui via VPC Link. Dentro do cluster o servico responde em pecas-insumos.oficina-mecanica:80.
  type: NodePort
  selector:
    app: pecas-insumos
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30083
